services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASSWORD: test
      DB_TABLE: extracted_files
      CONCURRENCY: 4
      PORT: 8080
      MAX_NESTING_DEPTH: 10
      TEMP_ROOT: /tmp/file-extractor
      LOG_LEVEL: INFO
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: test
    volumes:
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

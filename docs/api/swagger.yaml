openapi: 3.0.3

info:
  title: Archive Extractor / Analysis API
  version: 1.0.2
  description: |
    API for asynchronous archive extraction and firmware token analysis.
    Job submission returns HTTP 202 and clients poll status/results endpoints.

servers:
  - url: http://localhost:5000

paths:
  /health:
    get:
      summary: Health check
      description: Liveness probe with database connectivity check.
      responses:
        "200":
          description: Service and database are healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                required: [status]
        "500":
          description: Service is running but database check failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [error]
                required: [status]

  /extractions/:
    post:
      summary: Submit extraction job
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archive:
                  type: string
                  format: binary
                pattern:
                  type: string
                  default: "*.json"
              required:
                - archive
      responses:
        "202":
          description: Extraction job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSubmitResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /extractions/{job_id}:
    get:
      summary: Get extraction job status
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Extraction job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /extractions/{job_id}/results:
    get:
      summary: Get extraction results
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Extraction result page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResultsResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /analyze/:
    post:
      summary: Submit analysis job
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archive:
                  type: string
                  format: binary
              required:
                - archive
      responses:
        "202":
          description: Analysis job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSubmitResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /analyze/{job_id}:
    get:
      summary: Get analysis job status
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Analysis job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /analyze/{job_id}/results:
    get:
      summary: Get analysis results
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Analysis result page and CSV download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResultsResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /analyze/{job_id}/results/download:
    get:
      summary: Download analysis CSV result
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: Resource state conflict (for example, job not finished)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    JobSubmitResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued]
      required: [job_id, status]

    JobStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [queued, processing, completed, failed]
      required: [status]

    ExtractionFileItem:
      type: object
      properties:
        full_path:
          type: string
        file_name:
          type: string
        file_size:
          type: integer
        source_archive_name:
          type: string
        nesting_depth:
          type: integer
      required:
        - full_path
        - file_name
        - file_size
        - source_archive_name
        - nesting_depth

    ExtractionResultsResponse:
      type: object
      properties:
        total:
          type: integer
        files:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionFileItem"
        limit:
          type: integer
        offset:
          type: integer
      required: [total, files, limit, offset]

    AnalysisResultsResponse:
      type: object
      properties:
        total:
          type: integer
        statistics:
          type: object
          additionalProperties:
            type: integer
        csv_download_url:
          type: string
      required: [total, statistics, csv_download_url]

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required: [field, message]

    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
      required: [code, message, details]

    ErrorResponse:
      type: object
      properties:
        request_id:
          type: string
          nullable: true
        error:
          $ref: "#/components/schemas/ErrorBody"
      required: [request_id, error]
